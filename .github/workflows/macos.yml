# Builds WhisperLocal.app for macOS on GitHub's Mac runners and publishes a drag-to-Applications DMG:
# as a workflow artifact on every run, and as a GitHub Release asset for tags like v1.1.0.
name: macOS build

on:
  push:
    branches: [main, macos-support]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the DMG to releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # whisper-server only changes with the pinned whisper.cpp tag in the build script
      - uses: actions/cache@v4
        with:
          path: WhisperLocal.Mac/Runtime/whisper
          key: whisper-server-${{ matrix.arch }}-${{ hashFiles('scripts/build-mac.sh') }}

      - name: Build app and DMG
        run: scripts/build-mac.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperLocal-macOS-${{ matrix.arch }}
          path: artifacts/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
