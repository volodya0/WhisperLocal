# Builds WhisperLocal.app for macOS on GitHub's Mac runners and publishes a drag-to-Applications DMG:
# as a workflow artifact on every run, and as a GitHub Release, which "Check for Updates" in the app looks at:
# - every push to the macos-support branch is released automatically as v1.0.<run number>;
# - a pushed tag like v1.2.0 is released with that version.
#
# Signing: with the repository secrets MACOS_CERT_P12 (base64 of a .p12 with a code signing certificate,
# a self-signed one is enough) and MACOS_CERT_PASSWORD, every build is signed with that certificate, so macOS
# keeps the Accessibility permission across updates. Without them the build is signed ad hoc.
name: macOS build

on:
  push:
    # TEMPORARY: claude/gifted-fermat-h3i4rl (continuation hints) is built and released like macos-support; remove before merging
    branches: [main, macos-support, claude/gifted-fermat-h3i4rl]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Builds (including pull requests) only read; the release job alone may write
permissions:
  contents: read

jobs:
  build:
    # Apple Silicon only; scripts/build-mac.sh still builds for Intel when run on an Intel Mac
    runs-on: macos-15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The version decides what "Check for Updates" offers; builds that are not released keep the project's version
      - name: Version and whisper.cpp tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF_NAME" == macos-support || "$GITHUB_REF_NAME" == claude/gifted-fermat-h3i4rl ) ]]; then
            VERSION="1.0.$GITHUB_RUN_NUMBER"
          fi
          if [[ -n "${VERSION:-}" ]]; then
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "whisper=$(grep -oE 'WHISPER_CPP_TAG:-v[0-9.]+' scripts/build-mac.sh | cut -d- -f2)" >> "$GITHUB_OUTPUT"
          echo "llama=$(grep -oE 'LLAMA_CPP_TAG:-b[0-9]+' scripts/build-mac.sh | cut -d- -f2)" >> "$GITHUB_OUTPUT"

      # whisper-server only changes with the pinned whisper.cpp tag
      - uses: actions/cache@v4
        with:
          path: WhisperLocal.Mac/Runtime/whisper
          key: whisper-server-arm64-${{ steps.meta.outputs.whisper }}

      # llama-server (continuation hints) only changes with the pinned llama.cpp tag
      - uses: actions/cache@v4
        with:
          path: WhisperLocal.Mac/Runtime/llama
          key: llama-server-arm64-${{ steps.meta.outputs.llama }}

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not trusted for code signing until told so
          security find-certificate -a -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '$2 ~ /^[0-9A-F]{40}$/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::No code signing identity found in MACOS_CERT_P12"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build app and DMG
        run: |
          set -o pipefail
          scripts/build-mac.sh --dmg 2>&1 | tee build.log

      - name: Self-test the app (native classes and symbols resolve)
        run: |
          set -o pipefail
          artifacts/WhisperLocal.app/Contents/MacOS/WhisperLocal --self-test 2>&1 | tee -a build.log

      # The log tail as an annotation, readable from the checks API without access to the full logs
      - name: Report build failure
        if: failure()
        run: |
          # Annotations are cut at a few KB: skip compiler progress lines, keep error lines and the very end
          { grep -iE "error|fatal|failed|denied|not found|no such" build.log | grep -v "^\[" | tail -n 15; echo "-----"; grep -v "^\[ *[0-9]*%\]" build.log | tail -n 15; } > report.txt
          echo "::error title=build-mac.sh failed::$(awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", substr($0, 1, 200) }' report.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperLocal-macOS-arm64
          path: artifacts/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WhisperLocal-macOS-arm64
          path: artifacts

      # Creates the tag on the built commit for branch pushes (tags made with GITHUB_TOKEN start no new runs);
      # the commit message becomes the release notes shown by "Check for Updates"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: WhisperLocal ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: artifacts/*.dmg
