# Builds WhisperLocal for macOS (a drag-to-Applications DMG, on GitHub's Mac runners) and Windows (a zip of the app
# folder), each as Full and Lite (no local models: -lite.dmg, -lite.zip), on every push to any branch and every pull request: as workflow artifacts on every run, and as one GitHub
# Release with both downloads, which "Check for Updates" in the apps looks at:
# - every push to the main branch is released automatically as v1.0.<run number>;
# - a pushed tag like v1.2.0 is released with that version.
# (The file keeps its old name: the run number, and so the version, continues from it.)
#
# Signing: with the repository secrets MACOS_CERT_P12 (base64 of a .p12 with a code signing certificate,
# a self-signed one is enough) and MACOS_CERT_PASSWORD, every build is signed with that certificate, so macOS
# keeps the Accessibility permission across updates. Without them the build is signed ad hoc.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Builds (including pull requests) only read; the release job alone may write
permissions:
  contents: read

jobs:
  build:
    # Apple Silicon only; scripts/build-mac.sh still builds for Intel when run on an Intel Mac
    runs-on: macos-15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The version decides what "Check for Updates" offers; builds that are not released keep the project's version
      - name: Version and whisper.cpp tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            VERSION="1.0.$GITHUB_RUN_NUMBER"
          fi
          if [[ -n "${VERSION:-}" ]]; then
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "whisper=$(grep -oE 'WHISPER_CPP_TAG:-v[0-9.]+' scripts/build-mac.sh | cut -d- -f2)" >> "$GITHUB_OUTPUT"
          echo "llama=$(grep -oE 'LLAMA_CPP_TAG:-b[0-9]+' scripts/build-mac.sh | cut -d- -f2)" >> "$GITHUB_OUTPUT"

      # whisper-server only changes with the pinned whisper.cpp tag
      - uses: actions/cache@v4
        with:
          path: WhisperLocal.Mac/Runtime/whisper
          key: whisper-server-arm64-${{ steps.meta.outputs.whisper }}

      # llama-server (continuation hints) only changes with the pinned llama.cpp tag
      - uses: actions/cache@v4
        with:
          path: WhisperLocal.Mac/Runtime/llama
          key: llama-server-arm64-${{ steps.meta.outputs.llama }}

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not trusted for code signing until told so
          security find-certificate -a -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '$2 ~ /^[0-9A-F]{40}$/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::No code signing identity found in MACOS_CERT_P12"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build app and DMG
        run: |
          set -o pipefail
          scripts/build-mac.sh --dmg 2>&1 | tee build.log

      - name: Self-test the app (native classes and symbols resolve)
        run: |
          set -o pipefail
          artifacts/WhisperLocal.app/Contents/MacOS/WhisperLocal --self-test 2>&1 | tee -a build.log

      # Lite replaces artifacts/WhisperLocal.app; the Full DMG is already made
      - name: Build Lite app and DMG
        run: |
          set -o pipefail
          scripts/build-mac.sh --lite --dmg 2>&1 | tee -a build.log

      - name: Self-test the Lite app
        run: |
          set -o pipefail
          artifacts/WhisperLocal.app/Contents/MacOS/WhisperLocal --self-test 2>&1 | tee -a build.log

      # The log tail as an annotation, readable from the checks API without access to the full logs
      - name: Report build failure
        if: failure()
        run: |
          # Annotations are cut at a few KB: skip compiler progress lines, keep error lines and the very end
          { grep -iE "error|fatal|failed|denied|not found|no such" build.log | grep -v "^\[" | tail -n 15; echo "-----"; grep -v "^\[ *[0-9]*%\]" build.log | tail -n 15; } > report.txt
          echo "::error title=build-mac.sh failed::$(awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", substr($0, 1, 200) }' report.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperLocal-macOS-arm64
          path: artifacts/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The same version as the macOS build of this run (see its "Version" step)
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            echo "VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: pwsh
        run: |
          $props = @("-p:UpdateRepository=$env:UPDATE_REPOSITORY", "-p:DebugType=none")
          if ($env:VERSION) { $props += "-p:Version=$env:VERSION" }
          dotnet build WhisperLocal/WhisperLocal.csproj -c Release @props 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Self-test the app (shared windows start)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath WhisperLocal/bin/Release/net8.0-windows/WhisperLocal.exe -ArgumentList '--self-test' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err | Tee-Object -FilePath build.log -Append
          exit $p.ExitCode

      # The error lines as an annotation, readable from the checks API without access to the full logs
      - name: Report build failure
        if: failure()
        shell: pwsh
        run: |
          $lines = Get-Content build.log -ErrorAction SilentlyContinue | Select-String -Pattern 'error|failed' | Select-Object -Last 15
          $text = ($lines | ForEach-Object { $_.Line.Substring(0, [Math]::Min(250, $_.Line.Length)) }) -join '%0A'
          Write-Output "::error title=Windows build failed::$text"

      # The model is not included: the app downloads it from the setup checklist. 7-Zip's strongest zip (Deflate)
      # compression; still a plain zip that Explorer and the updater unpack.
      - name: Zip the app
        shell: pwsh
        run: |
          7z a -tzip -mx=9 -bd WhisperLocal-windows-x64.zip ./WhisperLocal/bin/Release/net8.0-windows/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Lite: the same app without the whisper.cpp runtime, in its own folder
      - name: Build Lite
        shell: pwsh
        run: |
          $props = @("-p:UpdateRepository=$env:UPDATE_REPOSITORY", "-p:DebugType=none", "-p:Edition=Lite", "-p:OutDir=$PWD/lite/")
          if ($env:VERSION) { $props += "-p:Version=$env:VERSION" }
          dotnet build WhisperLocal/WhisperLocal.csproj -c Release @props 2>&1 | Tee-Object -FilePath build.log -Append
          exit $LASTEXITCODE

      - name: Self-test the Lite app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath lite/WhisperLocal.exe -ArgumentList '--self-test' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err | Tee-Object -FilePath build.log -Append
          exit $p.ExitCode

      # Ends in -lite.zip, so the Full app's update check (which looks for -windows-x64.zip) never picks it
      - name: Zip the Lite app
        shell: pwsh
        run: |
          7z a -tzip -mx=9 -bd WhisperLocal-windows-x64-lite.zip ./lite/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # What the download consists of, to keep an eye on its size
      - name: Size report
        shell: pwsh
        run: |
          $dir = 'WhisperLocal/bin/Release/net8.0-windows'
          $files = Get-ChildItem $dir -Recurse -File
          "App folder: {0:N1} MB in {1} files; zip: {2:N1} MB" -f (($files | Measure-Object Length -Sum).Sum / 1MB), $files.Count, ((Get-Item WhisperLocal-windows-x64.zip).Length / 1MB)
          $files | Sort-Object Length -Descending | Select-Object -First 15 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path $dir).Path.Length + 1) }
          "Lite zip: {0:N1} MB" -f ((Get-Item WhisperLocal-windows-x64-lite.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperLocal-windows-x64
          path: WhisperLocal-windows-*.zip
          if-no-files-found: error

  release:
    needs: [build, windows]
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WhisperLocal-*
          path: artifacts
          merge-multiple: true

      # Creates the tag on the built commit for branch pushes (tags made with GITHUB_TOKEN start no new runs);
      # the commit message becomes the release notes shown by "Check for Updates"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: WhisperLocal ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
